[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everyday-agents"
version = "0.1.0"
description = "Small ML models and practical everyday agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
everyday-agents = "everyday_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
