name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run all unit and integration tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: uv build
      - name: Check a clean wheel installation
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/release-venv" --python "${{ matrix.python }}"
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" dist/*.whl
          uv run --locked python scripts/smoke_install.py --python "$RUNNER_TEMP/release-venv/bin/python"
